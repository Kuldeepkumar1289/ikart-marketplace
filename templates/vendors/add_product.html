{% extends 'base.html' %}

{% block title %}Upload New Product | IKart Seller Hub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-6">
    
    <!-- Top Back Link -->
    <a href="{% url 'vendor_dashboard' %}" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors mb-6">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Back to Seller Hub</span>
    </a>

    <div class="bg-white rounded-3xl p-8 sm:p-10 border border-slate-200/80 shadow-xl shadow-slate-200/50">
        <div class="mb-8">
            <span class="inline-block px-3 py-1 bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">
                Inventory Management
            </span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Upload New Product</h1>
            <p class="text-slate-500 text-sm mt-1">Fill out the details below to publish your listing instantly.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Product Title</label>
                <input type="text" name="name" required placeholder="e.g. Wireless Noise-Cancelling Headphones"
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 text-slate-800 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Category</label>
                <select name="category" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 text-slate-800 transition">
                    <option value="">Select a Category</option>
                    {% for cat in form.fields.category.queryset %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Price ($ USD)</label>
                    <input type="number" step="0.01" name="price" required placeholder="49.99"
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 text-slate-800 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Available Stock</label>
                    <input type="number" name="stock" required placeholder="25"
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 text-slate-800 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Product Description</label>
                <textarea name="description" rows="4" required placeholder="Describe features, specifications, and materials..."
                          class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 text-slate-800 transition resize-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Product Image</label>
                <input type="file" name="image" accept="image/*"
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition cursor-pointer">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 transition-all flex items-center justify-center gap-2 text-base mt-8">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Publish Listing to IKart</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
