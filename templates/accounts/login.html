{% extends 'base.html' %}

{% block title %}Sign In | IKart Marketplace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl shadow-slate-200/50">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                <i class="fa-solid fa-lock text-indigo-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to your buyer or seller account</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                {{ form.username }}
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                </div>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 transition-all flex items-center justify-center gap-2 mt-6">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Divider & Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-600">
                Want to sell on IKart? 
                <a href="{% url 'register_vendor' %}" class="font-bold text-indigo-600 hover:text-indigo-700">Open a Seller Store</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
